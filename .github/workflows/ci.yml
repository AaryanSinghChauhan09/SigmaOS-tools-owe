name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy -- -D warnings
      - name: Run AAA tests
        run: cargo test --verbose
